<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased p-8">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6">Appointment Details</h2>
        <div class="space-y-4 text-gray-700">
            <p><strong>Client:</strong> {{ appointment.client.full_name }}</p>
            <p><strong>Service:</strong> {{ appointment.service.name }}</p>
            <p><strong>Scheduled At:</strong> {{ appointment.scheduled_at }}</p>
            <p><strong>Status:</strong> {{ appointment.get_status_display }}</p>
            <p><strong>Notes:</strong> {{ appointment.notes|default:"No notes provided." }}</p>
        </div>
        <div class="mt-8">
            <a href="{% url 'appointment_list' %}" class="text-blue-600 hover:underline">← Back to List</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Appointment | Booking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- Navigation Bar -->
    <nav class="bg-blue-600 p-4 shadow-md">
        <div class="container mx-auto">
            <h1 class="text-white text-xl font-bold">📅 Appointment System</h1>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto mt-10 px-4 max-w-2xl">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Create New Appointment</h2>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <!-- Custom rendering for each field to apply Tailwind classes -->
                {% for field in form %}
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}

                <!-- Non-field errors (like the double booking error) -->
                {% if form.non_field_errors %}
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                        {% for error in form.non_field_errors %}
                            <span class="block sm:inline">{{ error }}</span>
                        {% endfor %}
                    </div>
                {% endif %}

                <div class="flex items-center justify-between pt-4">
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 transition font-semibold">
                        Save Appointment
                    </button>
                    <a href="{% url 'appointment_list' %}" class="text-gray-500 hover:text-gray-800 transition text-sm font-medium">
                        Cancel and Go Back
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>

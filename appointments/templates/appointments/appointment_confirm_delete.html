<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg text-center max-w-md w-full">
        <h2 class="text-xl font-bold text-red-600 mb-4">Archive Appointment?</h2>
        <p class="text-gray-700 mb-6">Are you sure you want to archive the appointment for <strong>{{ appointment.client.full_name }}</strong>? The record will be hidden but not deleted.</p>
        
        <form method="post" class="flex justify-center space-x-4">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded shadow hover:bg-red-700">Yes, Archive</button>
            <a href="{% url 'appointment_list' %}" class="bg-gray-200 text-gray-800 px-4 py-2 rounded shadow hover:bg-gray-300">Cancel</a>
        </form>
    </div>
</body>
</html>
